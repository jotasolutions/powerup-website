<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Un calendario del lunes y una lista de platos con lo que se mira y lo que se pide</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>

  <!-- Monday, reviewed -->
  <rect x="52" y="82" width="104" height="120" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <path d="M52 98a16 16 0 0 1 16-16h72a16 16 0 0 1 16 16v20H52Z" fill="#3482AA"/>
  <text x="104" y="109" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">LUN</text>
  <path d="M82 160l15 15 27-31" fill="none" stroke="#50B27F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

