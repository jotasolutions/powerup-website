  <rect x="240" y="100" width="80" height="8" rx="4" fill="#50B27F"/>
  <rect x="196" y="134" width="32" height="32" rx="8" fill="#DFFFEA"/>
  <rect x="240" y="138" width="100" height="8" rx="4" fill="#3482AA"/>
  <rect x="240" y="154" width="22" height="8" rx="4" fill="#FF9800"/>
  <circle cx="276" cy="158" r="5" fill="#FF9800"/>
  <rect x="196" y="188" width="32" height="32" rx="8" fill="#DEF8FF"/>
  <rect x="240" y="192" width="44" height="8" rx="4" fill="#3482AA"/>
  <rect x="240" y="208" width="52" height="8" rx="4" fill="#50B27F"/>
</svg>
