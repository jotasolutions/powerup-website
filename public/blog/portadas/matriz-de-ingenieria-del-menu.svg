    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-weight: 700; }
  </style>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>
  <rect x="40" y="36" width="156" height="110" rx="14" fill="#F8F0FF"/>
  <rect x="204" y="36" width="156" height="110" rx="14" fill="#DFFFEA"/>
