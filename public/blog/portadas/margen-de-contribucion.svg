    <rect x="50" y="90" width="76.4" height="50" fill="#FBBD8A"/>
    <rect x="126.4" y="90" width="196.4" height="50" fill="#50B27F"/>
    <rect x="322.8" y="90" width="27.2" height="50" fill="#CBD5E1"/>
  </g>
  <g clip-path="url(#b)">
    <rect x="50" y="170" width="32.7" height="50" fill="#FBBD8A"/>
    <rect x="82.7" y="170" width="130.9" height="50" fill="#50B27F"/>
    <rect x="213.6" y="170" width="16.4" height="50" fill="#CBD5E1"/>
  </g>
</svg>
