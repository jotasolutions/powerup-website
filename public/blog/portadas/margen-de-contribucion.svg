<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Dos precios divididos en ingredientes, margen e IVA</title>
  <defs>
    <clipPath id="a"><rect x="50" y="90" width="300" height="50" rx="12"/></clipPath>
    <clipPath id="b"><rect x="50" y="170" width="180" height="50" rx="12"/></clipPath>
  </defs>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>
  <!-- The article's arroz (16,50 €) and ensalada (9,90 €), at 18.18 px per euro -->
