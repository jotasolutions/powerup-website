<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Una carta digital y tres alternativas en fila</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>

  <!-- The menu you start from, on the left -->
  <rect x="40" y="96" width="76" height="108" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
  <g fill="#0F172A">
    <rect x="56" y="112" width="12" height="12" rx="1"/><rect x="74" y="112" width="12" height="12" rx="1"/>
    <rect x="56" y="130" width="12" height="12" rx="1"/><rect x="76" y="132" width="6" height="6"/>
  </g>
  <rect x="54" y="156" width="48" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="54" y="170" width="36" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="54" y="184" width="42" height="6" rx="3" fill="#CBD5E1"/>

  <!-- Arrow towards the options -->
  <path d="M132 150 L176 150" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M166 140 L178 150 L166 160" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Options in a column; the first one highlighted and larger -->
  <rect x="196" y="54" width="164" height="64" rx="10" fill="#DEF8FF" stroke="#3482AA" stroke-width="2.5"/>
  <circle cx="218" cy="78" r="8" fill="#3482AA"/>
  <rect x="236" y="73" width="100" height="9" rx="4.5" fill="#3482AA" opacity="0.5"/>
  <rect x="216" y="96" width="120" height="7" rx="3.5" fill="#3482AA" opacity="0.3"/>
  <g fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2">
    <rect x="196" y="134" width="164" height="34" rx="8"/>
    <rect x="196" y="180" width="164" height="34" rx="8"/>
    <rect x="196" y="226" width="164" height="34" rx="8"/>
  </g>
  <g fill="#CBD5E1">
    <circle cx="216" cy="151" r="6"/><rect x="232" y="147" width="84" height="8" rx="4"/>
    <circle cx="216" cy="197" r="6"/><rect x="232" y="193" width="70" height="8" rx="4"/>
    <circle cx="216" cy="243" r="6"/><rect x="232" y="239" width="90" height="8" rx="4"/>
  </g>
</svg>
