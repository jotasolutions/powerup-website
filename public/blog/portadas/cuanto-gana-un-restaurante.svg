<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Un billete de 100 € dividido en tres partes</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>
  <rect x="60" y="90" width="280" height="120" rx="14" fill="#DFFFEA" stroke="#334155" stroke-width="3"/>
  <text x="200" y="168" text-anchor="middle" font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#0F172A">100 €</text>
  <!-- Three parts: purchases, staff, what is left -->
  <rect x="60" y="226" width="165" height="16" rx="6" fill="#3482AA"/>
  <rect x="229" y="226" width="92" height="16" rx="6" fill="#FF9800"/>
  <rect x="325" y="226" width="15" height="16" rx="6" fill="#50B27F"/>
</svg>
