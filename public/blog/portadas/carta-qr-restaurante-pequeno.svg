<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Una mesa pequeña con un código QR y un móvil con la carta</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>
  <!-- Small round table -->
  <ellipse cx="170" cy="222" rx="110" ry="22" fill="#DEF8FF" stroke="#3482AA" stroke-width="3"/>
  <rect x="164" y="244" width="12" height="30" fill="#3482AA"/>
  <!-- QR stand on the table -->
  <path d="M120 214 L132 150 H180 L192 214 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
  <g fill="#0F172A">
    <rect x="140" y="160" width="10" height="10" rx="1.5"/><rect x="162" y="160" width="10" height="10" rx="1.5"/>
    <rect x="140" y="182" width="10" height="10" rx="1.5"/><rect x="156" y="176" width="5" height="5"/>
    <rect x="164" y="186" width="5" height="5"/><rect x="156" y="190" width="5" height="5"/>
  </g>
  <!-- Phone with a menu -->
  <rect x="236" y="56" width="92" height="172" rx="14" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
  <rect x="268" y="66" width="28" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="250" y="88" width="64" height="8" rx="4" fill="#3482AA"/>
  <rect x="250" y="108" width="52" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="250" y="120" width="40" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="250" y="138" width="56" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="250" y="150" width="36" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="250" y="168" width="48" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="250" y="180" width="30" height="5" rx="2.5" fill="#CBD5E1"/>
</svg>
