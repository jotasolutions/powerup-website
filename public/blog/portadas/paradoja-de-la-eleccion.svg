<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Muchas opciones de platos y un signo de interrogación</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>
  <!-- A grid of many dishes to choose from -->
  <g fill="#F8FAFC" stroke="#E2E8F0" stroke-width="2">
    <rect x="40" y="48" width="60" height="60" rx="10"/><rect x="110" y="48" width="60" height="60" rx="10"/><rect x="180" y="48" width="60" height="60" rx="10"/><rect x="250" y="48" width="60" height="60" rx="10"/>
    <rect x="40" y="120" width="60" height="60" rx="10"/><rect x="110" y="120" width="60" height="60" rx="10"/><rect x="180" y="120" width="60" height="60" rx="10"/><rect x="250" y="120" width="60" height="60" rx="10"/>
    <rect x="40" y="192" width="60" height="60" rx="10"/><rect x="110" y="192" width="60" height="60" rx="10"/><rect x="180" y="192" width="60" height="60" rx="10"/><rect x="250" y="192" width="60" height="60" rx="10"/>
  </g>
  <g>
    <circle cx="70" cy="78" r="16" fill="#FFEBAB"/><circle cx="140" cy="78" r="16" fill="#DFFFEA"/><circle cx="210" cy="78" r="16" fill="#DEF8FF"/><circle cx="280" cy="78" r="16" fill="#FBBD8A"/>
    <circle cx="70" cy="150" r="16" fill="#DEF8FF"/><circle cx="140" cy="150" r="16" fill="#FBBD8A"/><circle cx="210" cy="150" r="16" fill="#FFEBAB"/><circle cx="280" cy="150" r="16" fill="#DFFFEA"/>
    <circle cx="70" cy="222" r="16" fill="#DFFFEA"/><circle cx="140" cy="222" r="16" fill="#FFEBAB"/><circle cx="210" cy="222" r="16" fill="#FBBD8A"/><circle cx="280" cy="222" r="16" fill="#DEF8FF"/>
  </g>
  <circle cx="330" cy="70" r="36" fill="#3482AA"/>
  <text x="330" y="88" text-anchor="middle" style="font-family:Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:48px;font-weight:700;fill:#FFFFFF">?</text>
</svg>
