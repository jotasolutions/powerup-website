<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Una ficha de coste y una flecha hacia una carta con un precio destacado</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>
  <!-- Cost sheet -->
  <rect x="40" y="70" width="120" height="160" rx="12" fill="#DFFFEA" stroke="#334155" stroke-width="3"/>
  <g fill="#94A3B8">
    <rect x="58" y="96" width="50" height="9" rx="4.5"/><rect x="120" y="96" width="24" height="9" rx="4.5"/>
    <rect x="58" y="120" width="40" height="9" rx="4.5"/><rect x="120" y="120" width="24" height="9" rx="4.5"/>
    <rect x="58" y="144" width="56" height="9" rx="4.5"/><rect x="120" y="144" width="24" height="9" rx="4.5"/>
  </g>
  <line x1="58" y1="170" x2="144" y2="170" stroke="#334155" stroke-width="2"/>
  <rect x="58" y="186" width="40" height="11" rx="5.5" fill="#334155"/><rect x="112" y="183" width="32" height="17" rx="6" fill="#50B27F"/>
  <!-- Arrow -->
  <path d="M176 150 h44 m-12 -12 l12 12 l-12 12" stroke="#3482AA" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Menu -->
  <rect x="236" y="50" width="124" height="200" rx="12" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
  <g fill="#94A3B8">
    <rect x="254" y="78" width="88" height="10" rx="5"/>
    <rect x="254" y="112" width="52" height="9" rx="4.5"/><rect x="318" y="112" width="24" height="9" rx="4.5"/>
    <rect x="254" y="136" width="44" height="9" rx="4.5"/><rect x="318" y="136" width="24" height="9" rx="4.5"/>
    <rect x="254" y="200" width="48" height="9" rx="4.5"/><rect x="318" y="200" width="24" height="9" rx="4.5"/>
  </g>
  <rect x="246" y="156" width="104" height="32" rx="8" fill="#DFFFEA"/>
  <rect x="256" y="167" width="50" height="10" rx="5" fill="#334155"/><rect x="312" y="163" width="30" height="18" rx="6" fill="#50B27F"/>
</svg>
