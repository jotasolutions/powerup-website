<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Una carta digital y cinco alternativas</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>

  <!-- The menu everyone starts from, in the middle -->
  <rect x="166" y="104" width="68" height="92" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
  <g fill="#0F172A">
    <rect x="182" y="118" width="10" height="10" rx="1"/><rect x="198" y="118" width="10" height="10" rx="1"/>
    <rect x="182" y="134" width="10" height="10" rx="1"/><rect x="200" y="136" width="5" height="5"/>
  </g>
  <rect x="180" y="156" width="40" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="180" y="168" width="30" height="5" rx="2.5" fill="#CBD5E1"/>
  <rect x="180" y="180" width="36" height="5" rx="2.5" fill="#CBD5E1"/>

  <!-- Arrows out to five alternatives -->
  <g stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M200 100 L200 62"/>
    <path d="M162 124 L104 96"/>
    <path d="M238 124 L296 96"/>
    <path d="M162 178 L104 206"/>
    <path d="M238 178 L296 206"/>
  </g>

  <!-- Five smaller cards; the top one highlighted -->
  <rect x="176" y="22" width="48" height="36" rx="8" fill="#DEF8FF" stroke="#3482AA" stroke-width="2.5"/>
  <circle cx="200" cy="40" r="7" fill="#3482AA"/>
  <rect x="54" y="70" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="298" y="70" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="54" y="196" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="298" y="196" width="48" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <g fill="#CBD5E1">
    <rect x="64" y="84" width="28" height="5" rx="2.5"/>
    <rect x="308" y="84" width="28" height="5" rx="2.5"/>
    <rect x="64" y="210" width="28" height="5" rx="2.5"/>
    <rect x="308" y="210" width="28" height="5" rx="2.5"/>
  </g>
</svg>
