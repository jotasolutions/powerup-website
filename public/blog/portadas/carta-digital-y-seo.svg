<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Una búsqueda que encuentra la carta digital de un restaurante</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>

  <!-- Search box on top -->
  <rect x="56" y="40" width="288" height="40" rx="20" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
  <circle cx="80" cy="60" r="8" fill="none" stroke="#3482AA" stroke-width="2.5"/>
  <path d="M86 66 L92 72" stroke="#3482AA" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="104" y="56" width="120" height="8" rx="4" fill="#CBD5E1"/>

  <!-- Results: one highlighted result is the restaurant's menu -->
  <rect x="56" y="98" width="288" height="62" rx="12" fill="#DEF8FF" stroke="#3482AA" stroke-width="2"/>
  <rect x="72" y="112" width="140" height="8" rx="4" fill="#3482AA"/>
  <rect x="72" y="128" width="210" height="6" rx="3" fill="#3482AA" opacity="0.5"/>
  <rect x="72" y="140" width="170" height="6" rx="3" fill="#3482AA" opacity="0.5"/>

  <g fill="#CBD5E1">
    <rect x="72" y="182" width="120" height="8" rx="4"/>
    <rect x="72" y="198" width="196" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="72" y="224" width="104" height="8" rx="4"/>
    <rect x="72" y="240" width="180" height="6" rx="3" fill="#E2E8F0"/>
  </g>
</svg>
