    <rect x="106" y="170" width="8" height="8"/><rect x="118" y="164" width="8" height="8"/><rect x="140" y="170" width="8" height="8"/>
    <rect x="92" y="186" width="8" height="8"/><rect x="118" y="186" width="8" height="8"/><rect x="130" y="176" width="8" height="8"/>
    <rect x="142" y="188" width="8" height="8"/>
  </g>

  <path d="M174 150H208" stroke="#3482AA" stroke-width="5" stroke-linecap="round"/>
  <path d="M218 150L204 141V159Z" fill="#3482AA"/>

