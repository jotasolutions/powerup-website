<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <title>Una carta con los alérgenos señalados en cada plato</title>
  <rect width="400" height="300" rx="24" fill="#FFFFFF"/>

  <!-- Menu card -->
  <rect x="96" y="40" width="208" height="220" rx="14" fill="#FFFFFF" stroke="#334155" stroke-width="2.5"/>
  <rect x="148" y="58" width="104" height="9" rx="4.5" fill="#334155"/>

  <!-- Dish rows: name bar, price bar and allergen badges -->
  <g>
    <rect x="116" y="90" width="96" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="116" y="103" width="64" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="256" y="90" width="28" height="7" rx="3.5" fill="#CBD5E1"/>
    <circle cx="122" cy="122" r="7" fill="#FF9800"/><circle cx="141" cy="122" r="7" fill="#3482AA"/>
  </g>
  <g>
    <rect x="116" y="146" width="84" height="7" rx="3.5" fill="#CBD5E1"/>
    <rect x="116" y="159" width="70" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="256" y="146" width="28" height="7" rx="3.5" fill="#CBD5E1"/>
    <circle cx="122" cy="178" r="7" fill="#50B27F"/>
  </g>
  <!-- Highlighted dish: allergen info being checked -->
  <rect x="106" y="194" width="188" height="52" rx="10" fill="#DEF8FF" stroke="#3482AA" stroke-width="2"/>
  <rect x="116" y="204" width="90" height="7" rx="3.5" fill="#3482AA"/>
  <rect x="256" y="204" width="28" height="7" rx="3.5" fill="#3482AA" opacity="0.5"/>
  <circle cx="122" cy="230" r="7" fill="#FF9800"/><circle cx="141" cy="230" r="7" fill="#50B27F"/><circle cx="160" cy="230" r="7" fill="#3482AA"/>
</svg>
