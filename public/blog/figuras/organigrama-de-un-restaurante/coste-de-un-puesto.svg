<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 184" width="560" height="184">
  <title>Lo que cuesta de verdad un puesto con una base de 1.800 € al mes</title>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .legend { font-size: 16px; fill: #334155; }
  </style>
  <defs>
    <clipPath id="bar"><rect x="20" y="54" width="520" height="56" rx="12"/></clipPath>
  </defs>
  <rect width="560" height="184" fill="#FFFFFF"/>

  <text x="20" y="34" style="font-size:18px;font-weight:700;fill:#0F172A">Coste para la empresa: unos 2.351,70 € al mes</text>

  <!-- 520 px = 2.351,70 €: base 1.800 € → 398 px; cotizaciones 551,70 € → 122 px -->
  <g clip-path="url(#bar)">
    <rect x="20" y="54" width="398" height="56" fill="#3482AA"/>
    <rect x="418" y="54" width="122" height="56" fill="#FF9800"/>
  </g>
  <text x="219" y="89" text-anchor="middle" style="font-size:20px;font-weight:700;fill:#FFFFFF">1.800 €</text>
  <text x="479" y="88" text-anchor="middle" style="font-size:18px;font-weight:700;fill:#0F172A">551,70 €</text>

  <rect x="20" y="130" width="14" height="14" rx="3" fill="#3482AA"/>
  <text class="legend" x="42" y="143">Base de cotización</text>
  <rect x="20" y="156" width="14" height="14" rx="3" fill="#FF9800"/>
  <text class="legend" x="42" y="169">Cotizaciones de la empresa (30,65% de la base)</text>
</svg>
