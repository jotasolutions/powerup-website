<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330">
  <title>De dónde puede sacar Google la carta de la ficha de un restaurante</title>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .source { font-size: 16px; fill: #334155; }
    .card-title { font-size: 16px; font-weight: 600; fill: #0F172A; }
    .tab { font-size: 16px; font-weight: 600; fill: #3482AA; }
    .note { font-size: 16px; font-weight: 600; fill: #0F172A; }
  </style>
  <defs>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="560" height="330" fill="#FFFFFF"/>

  <!-- The five sources in Google's Business Profile help -->
  <g>
    <rect x="20" y="20" width="262" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text class="source" x="36" y="48">Tú, en «Editar menú»</text>
    <rect x="20" y="74" width="262" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text class="source" x="36" y="102">Una foto o un PDF de la carta</text>
    <rect x="20" y="128" width="262" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text class="source" x="36" y="156">La web del restaurante</text>
    <rect x="20" y="182" width="262" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text class="source" x="36" y="210">Un proveedor externo</text>
    <rect x="20" y="236" width="262" height="44" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text class="source" x="36" y="264">Fotos que suben los clientes</text>
  </g>

  <!-- Dotted orange connectors, as in the design's product images -->
  <g fill="none" stroke="#FF9800" stroke-width="2.5" stroke-dasharray="3 5" stroke-linecap="round">
    <path d="M282 42C312 42 312 150 340 150"/>
    <path d="M282 96C312 96 312 150 340 150"/>
    <path d="M282 150H340"/>
    <path d="M282 204C312 204 312 150 340 150"/>
    <path d="M282 258C312 258 312 150 340 150"/>
  </g>
  <circle cx="340" cy="150" r="5" fill="#FF9800"/>

  <!-- The profile, with its Menu tab -->
  <g filter="url(#sombra)">
    <rect x="344" y="40" width="196" height="222" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
  </g>
  <text class="card-title" x="362" y="72">Tu ficha en Google</text>
  <rect x="362" y="92" width="40" height="8" rx="4" fill="#E2E8F0"/>
  <text class="tab" x="416" y="101">Menú</text>
  <path d="M414 110H464" stroke="#3482AA" stroke-width="3" stroke-linecap="round"/>
  <rect x="478" y="92" width="44" height="8" rx="4" fill="#E2E8F0"/>
  <path d="M344 118H540" stroke="#E2E8F0"/>
  <rect x="362" y="132" width="34" height="34" rx="8" fill="#FFEBAB"/>
  <rect x="406" y="138" width="92" height="8" rx="4" fill="#334155"/>
  <rect x="406" y="152" width="66" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="362" y="178" width="34" height="34" rx="8" fill="#DFFFEA"/>
  <rect x="406" y="184" width="84" height="8" rx="4" fill="#334155"/>
  <rect x="406" y="198" width="72" height="6" rx="3" fill="#CBD5E1"/>
  <rect x="362" y="224" width="34" height="24" rx="8" fill="#DEF8FF"/>
  <rect x="406" y="230" width="90" height="8" rx="4" fill="#334155"/>

  <text class="note" x="20" y="314">Si hay varias fuentes, tú eliges cuál se muestra.</text>
</svg>
