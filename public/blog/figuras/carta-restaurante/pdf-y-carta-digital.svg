<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 412" width="560" height="412">
  <title>La misma carta en PDF y en carta digital, en el móvil</title>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .name { font-size: 20px; font-weight: 700; fill: #0F172A; }
    .note { font-size: 16px; fill: #475569; }
  </style>
  <rect width="560" height="412" fill="#FFFFFF"/>

  <!-- PDF: the printed page, shrunk to the phone's width -->
  <rect x="40" y="16" width="210" height="330" rx="30" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>
  <rect x="52" y="28" width="186" height="306" rx="20" fill="#F1F5F9"/>
  <rect x="120" y="36" width="50" height="10" rx="5" fill="#0F172A"/>
  <rect x="76" y="84" width="138" height="196" rx="3" fill="#FFFFFF" stroke="#E2E8F0"/>
  <rect x="120" y="96" width="50" height="5" rx="2" fill="#94A3B8"/>
  <g fill="#CBD5E1">
    <rect x="86" y="112" width="52" height="3"/><rect x="152" y="112" width="52" height="3"/>
    <rect x="86" y="120" width="44" height="3"/><rect x="152" y="120" width="40" height="3"/>
    <rect x="86" y="128" width="50" height="3"/><rect x="152" y="128" width="48" height="3"/>
    <rect x="86" y="136" width="40" height="3"/><rect x="152" y="136" width="52" height="3"/>
    <rect x="86" y="150" width="52" height="3"/><rect x="152" y="150" width="46" height="3"/>
    <rect x="86" y="158" width="46" height="3"/><rect x="152" y="158" width="52" height="3"/>
    <rect x="86" y="166" width="52" height="3"/><rect x="152" y="166" width="38" height="3"/>
    <rect x="86" y="174" width="36" height="3"/><rect x="152" y="174" width="50" height="3"/>
    <rect x="86" y="188" width="52" height="3"/><rect x="152" y="188" width="52" height="3"/>
    <rect x="86" y="196" width="42" height="3"/><rect x="152" y="196" width="44" height="3"/>
    <rect x="86" y="204" width="50" height="3"/><rect x="152" y="204" width="52" height="3"/>
    <rect x="86" y="212" width="44" height="3"/><rect x="152" y="212" width="36" height="3"/>
    <rect x="86" y="226" width="52" height="3"/><rect x="152" y="226" width="48" height="3"/>
    <rect x="86" y="234" width="38" height="3"/><rect x="152" y="234" width="52" height="3"/>
    <rect x="86" y="242" width="50" height="3"/><rect x="152" y="242" width="42" height="3"/>
    <rect x="86" y="250" width="46" height="3"/><rect x="152" y="250" width="50" height="3"/>
    <rect x="86" y="262" width="52" height="3"/><rect x="152" y="262" width="52" height="3"/>
  </g>
  <circle cx="200" cy="294" r="17" fill="#FFFFFF" stroke="#3482AA" stroke-width="4"/>
  <path d="M212 306L224 318M193 294H207M200 287V301" fill="none" stroke="#3482AA" stroke-width="4" stroke-linecap="round"/>
  <text class="name" x="145" y="376" text-anchor="middle">PDF</text>
  <text class="note" x="145" y="400" text-anchor="middle">Hay que ampliar para leer</text>

  <!-- Carta digital: made for the screen -->
  <rect x="310" y="16" width="210" height="330" rx="30" fill="#FFFFFF" stroke="#0F172A" stroke-width="5"/>
  <rect x="322" y="28" width="186" height="306" rx="20" fill="#FFFFFF"/>
  <rect x="390" y="36" width="50" height="10" rx="5" fill="#0F172A"/>
  <rect x="334" y="62" width="78" height="28" rx="14" fill="#3482AA"/>
  <rect x="418" y="62" width="78" height="28" rx="14" fill="#F1F5F9"/>
  <g>
    <rect x="334" y="108" width="56" height="56" rx="10" fill="#FFEBAB"/>
    <rect x="400" y="114" width="92" height="12" rx="6" fill="#334155"/>
    <rect x="400" y="134" width="84" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="400" y="150" width="40" height="10" rx="5" fill="#3482AA"/>
    <rect x="334" y="182" width="56" height="56" rx="10" fill="#DFFFEA"/>
    <rect x="400" y="188" width="80" height="12" rx="6" fill="#334155"/>
    <rect x="400" y="208" width="88" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="400" y="224" width="40" height="10" rx="5" fill="#3482AA"/>
    <rect x="334" y="256" width="56" height="56" rx="10" fill="#DEF8FF"/>
    <rect x="400" y="262" width="92" height="12" rx="6" fill="#334155"/>
    <rect x="400" y="282" width="76" height="8" rx="4" fill="#CBD5E1"/>
    <rect x="400" y="298" width="40" height="10" rx="5" fill="#3482AA"/>
