<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 380" width="560" height="380">
  <title>Dónde colocar cada plato dentro de una sección de la carta</title>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .note { font-size: 16px; fill: #334155; }
    .key { font-size: 16px; font-weight: 700; fill: #3482AA; }
    .keymid { font-size: 16px; font-weight: 700; fill: #475569; }
  </style>
  <rect width="560" height="380" fill="#FFFFFF"/>

  <rect x="20" y="20" width="380" height="344" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="44" y="58" style="font-size:18px;font-weight:700;fill:#0F172A">Principales</text>

  <!-- First and last dish of the section, highlighted -->
  <rect x="32" y="76" width="356" height="40" rx="10" fill="#DEF8FF"/>
  <rect x="32" y="76" width="6" height="40" rx="3" fill="#3482AA"/>
  <rect x="32" y="306" width="356" height="40" rx="10" fill="#DEF8FF"/>
  <rect x="32" y="306" width="6" height="40" rx="3" fill="#3482AA"/>

  <g fill="#0F172A">
    <rect x="48" y="85" width="150" height="11" rx="5.5"/><rect x="326" y="90" width="46" height="12" rx="6"/>
    <rect x="48" y="315" width="136" height="11" rx="5.5"/><rect x="326" y="320" width="46" height="12" rx="6"/>
  </g>
  <g fill="#94A3B8">
    <rect x="48" y="131" width="128" height="11" rx="5.5"/><rect x="326" y="136" width="46" height="12" rx="6"/>
    <rect x="48" y="177" width="160" height="11" rx="5.5"/><rect x="326" y="182" width="46" height="12" rx="6"/>
    <rect x="48" y="223" width="118" height="11" rx="5.5"/><rect x="326" y="228" width="46" height="12" rx="6"/>
    <rect x="48" y="269" width="142" height="11" rx="5.5"/><rect x="326" y="274" width="46" height="12" rx="6"/>
  </g>
  <g fill="#CBD5E1">
    <rect x="48" y="102" width="200" height="7" rx="3.5"/>
    <rect x="48" y="148" width="170" height="7" rx="3.5"/>
    <rect x="48" y="194" width="190" height="7" rx="3.5"/>
    <rect x="48" y="240" width="160" height="7" rx="3.5"/>
    <rect x="48" y="286" width="205" height="7" rx="3.5"/>
    <rect x="48" y="332" width="180" height="7" rx="3.5"/>
  </g>

  <text class="key" x="416" y="90">Principio:</text>
  <text class="note" x="416" y="110">lo que más te</text>
  <text class="note" x="416" y="130">interesa vender</text>

  <path d="M404 126H410V250H404" fill="none" stroke="#94A3B8" stroke-width="2"/>
  <text class="keymid" x="420" y="178">Medio:</text>
  <text class="note" x="420" y="198">lo que se</text>
  <text class="note" x="420" y="218">vende solo</text>

  <text class="key" x="416" y="318">Final:</text>
  <text class="note" x="416" y="338">lo que más te</text>
  <text class="note" x="416" y="358">interesa vender</text>
</svg>
