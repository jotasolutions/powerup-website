<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200">
  <title>Cómo la merma sube el coste de cada kilo que de verdad usas</title>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <clipPath id="kilo"><rect x="20" y="50" width="520" height="50" rx="12"/></clipPath>
  </defs>
  <rect width="560" height="200" fill="#FFFFFF"/>

  <text x="20" y="34" style="font-size:17px;font-weight:700;fill:#0F172A">1 kg de merluza comprado a 14 €</text>
  <!-- 520 px = 1.000 g -->
  <g clip-path="url(#kilo)">
    <rect x="20" y="50" width="312" height="50" fill="#3482AA"/>
    <rect x="332" y="50" width="208" height="50" fill="#E2E8F0"/>
  </g>
  <text x="176" y="81" text-anchor="middle" style="font-size:16px;font-weight:700;fill:#FFFFFF">600 g aprovechables</text>
  <text x="436" y="81" text-anchor="middle" style="font-size:16px;fill:#475569">400 g de merma</text>

  <text x="20" y="140" style="font-size:16px;fill:#475569">Coste real del kilo que de verdad usas</text>
  <text x="20" y="180" style="font-size:28px;font-weight:700;fill:#0F172A">14 € ÷ 0,6 = <tspan fill="#3482AA">23,33 €</tspan></text>
</svg>
