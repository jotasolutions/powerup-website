<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" width="560" height="220">
  <title>Cálculo del food cost del restaurante en un mes</title>
  <style>
    text { font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .row { font-size: 16px; font-weight: 700; fill: #0F172A; }
    .value { font-size: 20px; font-weight: 700; fill: #0F172A; }
    .label { font-size: 14px; fill: #475569; }
    .op { font-size: 26px; font-weight: 700; fill: #475569; }
  </style>
  <rect width="560" height="220" fill="#FFFFFF"/>

  <text class="row" x="20" y="22">Comida consumida en el mes</text>
  <g fill="#F1F5F9">
    <rect x="20" y="34" width="110" height="62" rx="12"/>
    <rect x="156" y="34" width="110" height="62" rx="12"/>
    <rect x="292" y="34" width="110" height="62" rx="12"/>
  </g>
  <rect x="428" y="34" width="112" height="62" rx="12" fill="#DEF8FF"/>
  <text class="value" x="75" y="62" text-anchor="middle">3.000 €</text>
  <text class="label" x="75" y="84" text-anchor="middle">Al empezar</text>
  <text class="op" x="143" y="74" text-anchor="middle">+</text>
  <text class="value" x="211" y="62" text-anchor="middle">9.500 €</text>
  <text class="label" x="211" y="84" text-anchor="middle">Compras</text>
  <text class="op" x="279" y="74" text-anchor="middle">−</text>
  <text class="value" x="347" y="62" text-anchor="middle">2.700 €</text>
  <text class="label" x="347" y="84" text-anchor="middle">Al terminar</text>
  <text class="op" x="415" y="74" text-anchor="middle">=</text>
  <text class="value" x="484" y="62" text-anchor="middle">9.800 €</text>
  <text class="label" x="484" y="84" text-anchor="middle">Consumida</text>

  <text class="row" x="20" y="134">Food cost del mes</text>
  <rect x="20" y="146" width="150" height="62" rx="12" fill="#DEF8FF"/>
  <rect x="205" y="146" width="150" height="62" rx="12" fill="#F1F5F9"/>
  <rect x="390" y="146" width="150" height="62" rx="12" fill="#DFFFEA"/>
  <text class="value" x="95" y="174" text-anchor="middle">9.800 €</text>
  <text class="label" x="95" y="196" text-anchor="middle">Consumida</text>
  <text class="op" x="187.5" y="186" text-anchor="middle">÷</text>
  <text class="value" x="280" y="174" text-anchor="middle">32.000 €</text>
  <text class="label" x="280" y="196" text-anchor="middle">Ventas de comida</text>
  <text class="op" x="372.5" y="186" text-anchor="middle">=</text>
  <text class="value" x="465" y="174" text-anchor="middle">30,6%</text>
  <text class="label" x="465" y="196" text-anchor="middle">Food cost</text>
</svg>
